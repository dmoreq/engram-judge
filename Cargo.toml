[package]
name = "engram-judge"
version = "1.0.0"
edition = "2021"
description = "Offline semantic judge for engram gray-zone reuse and memory verdicts."
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.90"

[lib]
name = "engram_judge"
path = "src/lib.rs"

[[bin]]
name = "eg-judge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
candle-nn = "0.11"
tokenizers = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"
